name: unit_test

on:
  push:
  pull_request:

jobs:
  unit_test:

    runs-on: ubuntu-latest
    strategy:
      # parallel running result in conflict when git-push to a same branch
      max-parallel: 1
      matrix:
        # Test minimum supported (3.10), middle (3.11), and latest (3.14)
        python-version: ["3.10", "3.11", "3.14"]

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # The version in .pre-commit-config.yaml, so that CI and pre-commit format the code the same way.
        pip install ruff==0.16.10
        pip install -e ".[test]"

    - name: Install npm dependencies
      run: |
        if [ -f package.json ]; then
          npm install;
        fi
        echo "add node module path: $GITHUB_WORKSPACE/node_modules/.bin/"
        echo "$GITHUB_WORKSPACE/node_modules/.bin/" >> $GITHUB_PATH

    - name: Install apt dependencies
      run: |
        if [ -f packages.txt ]; then cat packages.txt | xargs sudo apt-get install; fi

    - name: Install playwright browser
      run: |
        # k3down2 renders images with playwright chromium
        python -m playwright install --with-deps chromium

    - name: Lint and format with ruff
      run: |
        # Format code with ruff (fast Python formatter)
        ruff format --check .
        # Lint code with ruff (fast Python linter)
        ruff check .

    - name: Type check with mypy
      run: |
        pip install mypy types-PyYAML
        mypy md2zhihu --ignore-missing-imports

    - name: Test with pytest
      env:
        # pass in committer and token to access a test repo:
        # https://github.com/drmingdrmer/md2test
        MD2TEST_USERNAME: ${{ github.repository_owner }}
        MD2TEST_TOKEN: ${{ secrets.MD2TEST_TOKEN }}
        # Some tests push to git@gitee.com. The push fails on CI, which has no ssh key,
        # but a stalled network can hang it for hours. These two timeouts end it in seconds.
        GIT_SSH_COMMAND: ssh -o ConnectTimeout=10 -o ServerAliveInterval=10
      run: |
        pytest -xv

    - uses: actions/upload-artifact@v4
      if: failure()
      with:
        path: test/

  action_test:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Convert a markdown with the action in this commit
      uses: ./
      env:
        GITHUB_USERNAME: ${{ github.repository_owner }}
        GITHUB_TOKEN: ${{ secrets.MD2TEST_TOKEN }}
      with:
        # "**" stands for the two folders test/data/, which it matches only with bash's globstar option.
        pattern: '**/transparent/src/transparent.md'
        asset_repo: https://github.com/drmingdrmer/md2test.git
        asset_branch: action_test
        output_branch: ''

    - name: Check the output
      run: |
        # The images in the converted markdown load from the asset repo.
        grep -F 'https://cdn.jsdelivr.net/gh/drmingdrmer/md2test@action_test/transparent/' _md2zhihu/transparent.md
        # The runner user owns the output, so later steps can change it.
        test -O _md2zhihu/transparent.md
