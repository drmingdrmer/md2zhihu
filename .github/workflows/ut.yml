name: unit_test

on:
  push:
  pull_request:
  # A week with no push still runs, so a new runner image or pandoc shows up here.
  # Monday 02:00 UTC is 10:00 in China. GitHub may start the run later.
  schedule:
    - cron: "0 2 * * 1"

jobs:
  unit_test:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Test minimum supported (3.10), middle (3.11), and latest (3.14)
        python-version: ["3.10", "3.11", "3.14"]
        include:
          # The oldest Python also runs with the oldest k3down2 and k3proc that pyproject.toml allows,
          # because md2zhihu reads the errors that they raise.
          - python-version: "3.10"
            deps: oldest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # The version in .pre-commit-config.yaml, so that CI and pre-commit format the code the same way.
        pip install ruff==0.16.10
        pip install -e ".[test]"
        if [ "${{ matrix.deps }}" = oldest ]; then
          # The lower bound in pyproject.toml, such as "k3down2>=0.2.0", becomes a pin, such as k3down2==0.2.0.
          for dep in k3down2 k3proc; do
            pip install "$(grep -o "\"$dep>=[0-9.]*" pyproject.toml | sed 's/^"//; s/>=/==/')"
          done
        fi

    - name: Install npm dependencies
      run: |
        if [ -f package.json ]; then
          npm install;
        fi
        echo "add node module path: $GITHUB_WORKSPACE/node_modules/.bin/"
        echo "$GITHUB_WORKSPACE/node_modules/.bin/" >> $GITHUB_PATH
        # k3down2 renders math with its tex2svg.js in site-packages, where node finds mathjax-full only through NODE_PATH.
        echo "NODE_PATH=$GITHUB_WORKSPACE/node_modules" >> $GITHUB_ENV

    - name: Install apt dependencies
      run: |
        if [ -f packages.txt ]; then cat packages.txt | xargs sudo apt-get install; fi

    - name: Install playwright browser
      run: |
        # k3down2 renders images with playwright chromium
        python -m playwright install --with-deps chromium

    - name: Lint and format with ruff
      run: |
        # Format code with ruff (fast Python formatter)
        ruff format --check .
        # Lint code with ruff (fast Python linter)
        ruff check .

    - name: Type check with mypy
      run: |
        pip install mypy types-PyYAML
        mypy md2zhihu --ignore-missing-imports

    - name: Test with pytest
      run: |
        # A failed test keeps its files in test-output, which the next step uploads.
        pytest -xv --basetemp="$RUNNER_TEMP/test-output"
        pytest -xv -m integration --basetemp="$RUNNER_TEMP/test-output"

    - uses: actions/upload-artifact@v4
      if: failure()
      with:
        path: ${{ runner.temp }}/test-output/

  action_test:

    runs-on: ubuntu-latest

    # The action pulls its image before each run, so the image of this commit reaches it through this registry.
    services:
      registry:
        image: registry:3
        ports:
          - 5000:5000

    steps:
    - uses: actions/checkout@v7

    - name: Build the image of this commit
      run: |
        docker build -t localhost:5000/md2zhihu:test .
        docker push localhost:5000/md2zhihu:test

    - name: Make a push fail
      run: |
        # The action must push nothing, so a push to origin fails the action.
        git remote set-url --push origin "$RUNNER_TEMP/no-such-repo.git"

    - name: Convert a markdown with the action in this commit
      uses: ./
      with:
        image: localhost:5000/md2zhihu:test
        # "**" stands for the two folders test/data/, which it matches only with bash's globstar option.
        pattern: '**/transparent/src/transparent.md'

    - name: Check the output
      run: |
        # Print each command, so that a failed check shows the values it compared.
        set -x
        want=test/data/action/want

        # Each image loads from _md2zhihu/ on the branch <branch>-md2zhihu of this repo, which is the default of
        # asset_url_prefix. The wanted markdown names the repo and the branch OWNER/REPO@BRANCH.
        prefix="https://cdn.jsdelivr.net/gh/$GITHUB_REPOSITORY@$GITHUB_REF_NAME-md2zhihu/"
        sed "s|$prefix|https://cdn.jsdelivr.net/gh/OWNER/REPO@BRANCH-md2zhihu/|g" _md2zhihu/transparent.md \
          | diff -u $want/transparent.md -
        # The runner user owns the output, so later steps can change it.
        test -O _md2zhihu/transparent.md

        # The images are in _md2zhihu, at the paths in their URLs after the prefix, and nothing else is written.
        find _md2zhihu -type f | sort | diff -u $want/files.txt -
        test ! -e _md2

        # The action commits nothing, and adds nothing to the index.
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        test "$(git status --porcelain)" = "?? _md2zhihu/"
