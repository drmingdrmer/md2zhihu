name: Publish Docker image

on:
  push:
    tags:
      - v*

jobs:
  build:

    # Each arch builds on a native runner: mermaid-cli's Chrome hangs on an emulated CPU,
    # and then the render test in Dockerfile fails.
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v4

    - name: Log in to ghcr.io
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: ghcr.io/${{ github.repository }}:${{ github.ref_name }}-${{ matrix.arch }}

  merge:

    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write

    steps:
    - name: Log in to ghcr.io
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Join the arch images into one tag
      run: |
        image=ghcr.io/${{ github.repository }}
        tag=${{ github.ref_name }}
        docker buildx imagetools create -t "$image:$tag" -t "$image:latest" "$image:$tag-amd64" "$image:$tag-arm64"
