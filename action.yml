name: 'md2zhihu'
description: >
  Convert markdown for Zhihu, WeChat, or Weibo, and write it with its images into a folder of the workspace.

branding:
  icon: upload-cloud
  color: green

inputs:
  pattern:
    description: 'file pattern to convert'
    required: false
    default: '**/*.md'

  output_dir:
    description: |-
      dir to store converted markdown.
    required: false
    default: '_md2zhihu'

  asset_url_prefix:
    description: |-
      The public URL of `output_dir` once a later step of the workflow publishes it.
      md2zhihu puts it before each relative URL of the converted markdown, such as `post/<hash>-a.png` of an image of `post.md`,
      so that a platform such as zhihu.com loads the image from there.
      The action pushes nothing, so the URL works only after the workflow publishes `output_dir` at that place.

      The default is the URL that jsDelivr serves `_md2zhihu/` at, on the branch `<branch>-md2zhihu` of this repo,
      which the example workflow in README.md pushes.
      Change it together with `output_dir`, or with the branch that the workflow pushes.

      A relative link to another file, such as `../other.md`, also gets the prefix.
      Set it to "" to keep every relative URL as it is.

    required: false
    default: 'https://cdn.jsdelivr.net/gh/${{ github.repository }}@${{ github.ref_name }}-md2zhihu/_md2zhihu/'

  target_platform:
    description: |-
      The platform that the converted markdown should be compatible to.

      Currently supported platforms are zhihu, wechat, weibo, simple.
      `simple` converts almost everything to images and removes most text styles.
      E.g. inline code block is converted to normal text.

    required: false
    default: 'zhihu'

  image:
    description: |-
      The docker image that runs md2zhihu. The action pulls it from its registry before each run.
      Set it to a release, such as `ghcr.io/drmingdrmer/md2zhihu:v0.23`, to keep using that release.
      An image of 0.22 or earlier can not run this action. To keep the push of 0.22, use `drmingdrmer/md2zhihu@v0.22`.

    required: false
    default: 'ghcr.io/drmingdrmer/md2zhihu:latest'

runs:
  using: "composite"
  steps:
    - name: convert
      id: convert
      run: |
        # globstar: "**" in the pattern matches any number of folders, not just one, as "*" does.
        # nullglob: a pattern that matches no file passes no file, and md2zhihu fails because it gets no input.
        shopt -s globstar nullglob

        # The rule leaves each URL with a scheme or a host, such as https: and data:, a path from the root,
        # and a reference to a query or a fragment, such as "#intro", and puts the prefix before every other URL.
        rewrite=()
        if [ -n "$ASSET_URL_PREFIX" ]; then
          rewrite=(--rewrite-if-not '^([A-Za-z][A-Za-z0-9+.-]*:|//|/|[?#]|$)' '^' "$ASSET_URL_PREFIX")
        fi

        # The image holds md2zhihu and every tool it runs.
        # --pull always: a self-hosted runner keeps images, and would run an old `latest`.
        # --user: later steps can change the files that md2zhihu writes.
        # -v and -w keep the workspace path, so a path in the inputs is valid in the container.
        docker run --rm --pull always \
          --user "$(id -u):$(id -g)" \
          -v "$PWD:$PWD" -w "$PWD" \
          '${{ inputs.image }}' \
          md2zhihu \
          --code-width 600 \
          --platform ${{ inputs.target_platform }} \
          --output-dir ${{ inputs.output_dir }} \
          --md-output ${{ inputs.output_dir }}/ \
          "${rewrite[@]}" \
          ${{ inputs.pattern }}
      env:
        ASSET_URL_PREFIX: ${{ inputs.asset_url_prefix }}
      shell: bash
